<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="bd47690c-1c4e-4e28-a0c5-570005686aa2"></script>
    <title>התחברות - פרקי אבות</title>
    <link rel="icon" type="image/png" href="/static/pics/pirkei-avot-online-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        body {
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            margin: 0 !important;
            padding: 0 !important;
            background:
                linear-gradient(135deg,
                    rgba(0, 29, 41, 0.8) 0%,
                    rgba(25, 25, 112, 0.6) 30%,
                    rgba(218, 165, 32, 0.4) 50%,
                    rgba(25, 25, 112, 0.6) 70%,
                    rgba(0, 29, 41, 0.8) 100%),
                url('/static/pics/background_book.png') center center/cover no-repeat fixed !important;
            min-height: 100vh !important;
            position: relative !important;
            overflow-x: hidden !important;
            color: #F5F5DC !important;
            background-attachment: fixed !important;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(147, 51, 234, 0.8)); }
        }
        .logo-animate {
            animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
        }
        .logo-animate:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body class="min-h-screen" x-data="loginApp()" x-init="init()">

    <!-- Header Section -->
    <header class="header-mystical border-b border-gray-100 mb-4">
        <div class="container mx-auto py-4">
            <div class="text-center">
                <a href="/index.html" class="inline-block">
                    <img src="/static/pics/pirkei-avot-online-logo.png" alt="פרקי אבות אונליין"
                        class="h-40 md:h-52 w-auto object-contain mx-auto logo-animate transition-all duration-500">
                </a>
            </div>
        </div>
    </header>

    <!-- Login Form -->
    <div class="container mx-auto px-4 mb-12">
        <div class="max-w-md mx-auto">
            <div class="content-overlay p-8 rounded-2xl shadow-xl">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold mb-2" style="color: #191970;">התחברות למערכת</h2>
                    <p class="text-gray-600">אנא התחבר עם החשבון שלך</p>
                    <div class="w-24 h-1 mx-auto mt-4 rounded-full"
                        style="background: linear-gradient(45deg, #DAA520, #FFD700, #B8860B);"></div>
                </div>

                <!-- Error Message -->
                <template x-if="errorMessage">
                    <div class="bg-red-50 border-2 border-red-300 rounded-xl p-4 mb-6"
                         x-transition:enter="transition ease-out duration-300"
                         x-transition:enter-start="opacity-0 transform scale-95"
                         x-transition:enter-end="opacity-100 transform scale-100">
                        <div class="flex items-center">
                            <svg class="w-5 h-5 ml-2 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-red-800 font-semibold text-sm" x-text="errorMessage"></p>
                        </div>
                    </div>
                </template>

                <form @submit.prevent="login()" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-bold mb-2" style="color: #1F2937;">אימייל</label>
                        <input type="email" id="email" x-model="email" required
                            placeholder="הכנס אימייל"
                            class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 transition-all duration-200">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-bold mb-2" style="color: #1F2937;">סיסמה</label>
                        <input type="password" id="password" x-model="password" required
                            placeholder="הכנס סיסמה"
                            class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 transition-all duration-200">
                        <!-- Forgot Password Link -->
                        <div class="text-left mt-2">
                            <button type="button" @click="showForgotPassword = !showForgotPassword"
                                class="text-xs font-medium hover:underline transition-all duration-200"
                                style="color: #191970;">
                                שכחת סיסמה?
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Section (inline) -->
                    <div x-show="showForgotPassword" x-cloak
                         x-transition:enter="transition ease-out duration-300"
                         x-transition:enter-start="opacity-0 transform scale-95"
                         x-transition:enter-end="opacity-100 transform scale-100"
                         class="border-2 border-yellow-200 rounded-xl p-4 space-y-3"
                         style="background: rgba(218, 165, 32, 0.05);">

                        <h3 class="text-sm font-bold" style="color: #191970;">איפוס סיסמה</h3>

                        <!-- Forgot Error -->
                        <template x-if="forgotError">
                            <div class="bg-red-50 border border-red-300 rounded-lg p-3">
                                <p class="text-red-800 text-xs font-semibold" x-text="forgotError"></p>
                            </div>
                        </template>

                        <!-- Forgot Success -->
                        <template x-if="forgotMessage">
                            <div class="bg-green-50 border border-green-300 rounded-lg p-3">
                                <p class="text-green-800 text-xs font-semibold" x-text="forgotMessage"></p>
                            </div>
                        </template>

                        <!-- Step 1: Enter email to receive code -->
                        <div x-show="forgotStep === 1" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold mb-1" style="color: #1F2937;">אימייל לאיפוס</label>
                                <input type="email" x-model="forgotEmail"
                                    placeholder="הכנס את כתובת האימייל שלך"
                                    class="w-full border-2 border-gray-200 p-2 rounded-lg text-sm focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 transition-all duration-200">
                            </div>
                            <button type="button" @click="sendResetCode()" :disabled="forgotLoading"
                                class="w-full py-2 px-4 rounded-lg font-bold text-sm shadow hover:shadow-md transition-all duration-200"
                                style="background: linear-gradient(45deg, #DAA520, #FFD700); color: #1F2937;"
                                :class="{ 'opacity-60 cursor-not-allowed': forgotLoading }">
                                <span x-text="forgotLoading ? 'שולח...' : 'שלח קוד'"></span>
                            </button>
                        </div>

                        <!-- Step 2: Enter code and new password -->
                        <div x-show="forgotStep === 2" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold mb-1" style="color: #1F2937;">קוד אימות</label>
                                <input type="text" x-model="resetCode"
                                    placeholder="הכנס את הקוד שנשלח לאימייל"
                                    class="w-full border-2 border-gray-200 p-2 rounded-lg text-sm focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 transition-all duration-200">
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1" style="color: #1F2937;">סיסמה חדשה</label>
                                <input type="password" x-model="newPassword"
                                    placeholder="הכנס סיסמה חדשה"
                                    class="w-full border-2 border-gray-200 p-2 rounded-lg text-sm focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 transition-all duration-200">
                            </div>
                            <button type="button" @click="confirmReset()" :disabled="forgotLoading"
                                class="w-full py-2 px-4 rounded-lg font-bold text-sm shadow hover:shadow-md transition-all duration-200"
                                style="background: linear-gradient(45deg, #DAA520, #FFD700); color: #1F2937;"
                                :class="{ 'opacity-60 cursor-not-allowed': forgotLoading }">
                                <span x-text="forgotLoading ? 'מאפס...' : 'אפס סיסמה'"></span>
                            </button>
                        </div>
                    </div>

                    <div class="text-center pt-2">
                        <button type="submit" :disabled="loading"
                            class="main-search-btn px-8 py-3 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200 inline-flex items-center"
                            :class="{ 'opacity-60 cursor-not-allowed': loading }">
                            <svg x-show="!loading" class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                            </svg>
                            <svg x-show="loading" x-cloak class="animate-spin w-5 h-5 ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                            <span x-text="loading ? 'מתחבר...' : 'התחבר'"></span>
                        </button>
                    </div>
                </form>

                <div class="text-center mt-6 space-y-2">
                    <div>
                        <a href="/index.html" class="text-sm font-medium hover:underline transition-all duration-200" style="color: #191970;">
                            חזרה לדף הבית
                        </a>
                    </div>
                    <div>
                        <p class="text-sm" style="color: #4a5568;">
                            עדיין אין לך חשבון?
                            <a href="/register.html" class="font-bold hover:underline transition-all duration-200" style="color: #191970;">
                                הירשם כאן
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="footer-ancient mt-8 py-6">
        <div class="container mx-auto text-center">
            <p class="text-sm" style="direction: ltr; display: flex; justify-content: center; align-items: center;">
                Built by
                <a href="https://www.linkedin.com/in/moti-shaul"
                    target="_blank" rel="noopener noreferrer"
                    class="hover:underline font-medium inline-flex items-center"
                    style="margin-left: 0.25rem; color: #DAA520;">
                    Moti Shaul
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 ml-1" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M22.225 0H1.771C.791 0 0 .776 0 1.729v20.543C0 23.214.792 24 1.77 24h20.453C23.208 24 24 23.214 24 22.272V1.729C24 .776 23.208 0 22.225 0zM7.119 20.459H3.56V9h3.558v11.459zM5.341 7.447c-1.134 0-2.054-.91-2.054-2.032a2.054 2.054 0 114.109 0c0 1.122-.92 2.032-2.055 2.032zM20.453 20.459h-3.558v-5.661c0-1.35-.027-3.086-1.885-3.086-1.889 0-2.178 1.476-2.178 3v5.747h-3.557V9h3.417v1.561h.049c.476-.9 1.633-1.848 3.36-1.848 3.593 0 4.257 2.364 4.257 5.435v6.311z"/>
                    </svg>
                </a>
            </p>
        </div>
    </footer>

    <script>
        function loginApp() {
            return {
                email: '',
                password: '',
                errorMessage: '',
                loading: false,

                // Forgot password state
                showForgotPassword: false,
                forgotStep: 1,
                forgotEmail: '',
                resetCode: '',
                newPassword: '',
                forgotMessage: '',
                forgotError: '',
                forgotLoading: false,

                init() {
                    // If already logged in, redirect based on role
                    const token = localStorage.getItem('authToken');
                    if (token) {
                        const role = this._getRoleFromToken(token);
                        if (role === 'admin') {
                            window.location.href = '/manage.html';
                        } else {
                            window.location.href = '/personal.html';
                        }
                    }
                },

                // Decode JWT payload to extract role
                _getRoleFromToken(token) {
                    try {
                        const parts = token.split('.');
                        if (parts.length !== 3) return null;
                        const payload = JSON.parse(atob(parts[1]));
                        return payload['custom:role'] || payload['role'] || null;
                    } catch (e) {
                        return null;
                    }
                },

                async login() {
                    this.errorMessage = '';
                    this.loading = true;

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.email,
                                password: this.password
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            // Show error as-is for disabled accounts (403 or message containing 'מושבת')
                            const errMsg = data.error || 'שם משתמש או סיסמה שגויים';
                            if (response.status === 403 || errMsg.includes('מושבת')) {
                                this.errorMessage = errMsg;
                            } else {
                                this.errorMessage = errMsg;
                            }
                            return;
                        }

                        if (data.token) {
                            localStorage.setItem('authToken', data.token);
                            // Role-based redirect
                            const role = data.role || this._getRoleFromToken(data.token);
                            if (role === 'admin') {
                                window.location.href = '/manage.html';
                            } else {
                                window.location.href = '/personal.html';
                            }
                        } else {
                            this.errorMessage = data.error || 'שם משתמש או סיסמה שגויים';
                        }
                    } catch (e) {
                        this.errorMessage = 'שגיאת תקשורת. אנא בדוק את החיבור לאינטרנט.';
                    } finally {
                        this.loading = false;
                    }
                },

                async sendResetCode() {
                    this.forgotError = '';
                    this.forgotMessage = '';
                    this.forgotLoading = true;

                    try {
                        const response = await fetch('/api/auth/forgot-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.forgotEmail })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.forgotStep = 2;
                            this.forgotMessage = 'קוד אימות נשלח לאימייל שלך';
                        } else {
                            this.forgotError = data.error || 'אירעה שגיאה בשליחת הקוד';
                        }
                    } catch (e) {
                        this.forgotError = 'שגיאת תקשורת. אנא בדוק את החיבור לאינטרנט.';
                    } finally {
                        this.forgotLoading = false;
                    }
                },

                async confirmReset() {
                    this.forgotError = '';
                    this.forgotMessage = '';
                    this.forgotLoading = true;

                    try {
                        const response = await fetch('/api/auth/confirm-reset', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.forgotEmail,
                                code: this.resetCode,
                                new_password: this.newPassword
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.forgotMessage = 'הסיסמה אופסה בהצלחה! כעת תוכל להתחבר עם הסיסמה החדשה.';
                            // Hide forgot section after success
                            setTimeout(() => {
                                this.showForgotPassword = false;
                                this.forgotStep = 1;
                                this.forgotEmail = '';
                                this.resetCode = '';
                                this.newPassword = '';
                                this.forgotMessage = '';
                            }, 3000);
                        } else {
                            this.forgotError = data.error || 'אירעה שגיאה באיפוס הסיסמה';
                        }
                    } catch (e) {
                        this.forgotError = 'שגיאת תקשורת. אנא בדוק את החיבור לאינטרנט.';
                    } finally {
                        this.forgotLoading = false;
                    }
                }
            };
        }
    </script>
</body>

</html>
